<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Parliament Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Code Parliament</h1>
      <div class="status-badge" id="status-badge">Loading...</div>
    </header>

    <main>
      <!-- Score Section -->
      <section class="score-section">
        <div class="score-card main-score">
          <div class="score-value" id="main-score">--</div>
          <div class="score-label">Project Score</div>
          <div class="score-target">Target: <span id="target-score">95</span>%</div>
        </div>

        <div class="agent-scores">
          <div class="score-card agent">
            <div class="agent-icon">Architect</div>
            <div class="score-value" id="architect-avg">--</div>
          </div>
          <div class="score-card agent">
            <div class="agent-icon">Critic</div>
            <div class="score-value" id="critic-avg">--</div>
          </div>
          <div class="score-card agent">
            <div class="agent-icon">Pragmatist</div>
            <div class="score-value" id="pragmatist-avg">--</div>
          </div>
        </div>
      </section>

      <!-- Stats Section -->
      <section class="stats-section">
        <div class="stat-card">
          <div class="stat-value" id="files-analyzed">0</div>
          <div class="stat-label">Files Analyzed</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="files-passing">0</div>
          <div class="stat-label">Passing</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="files-failing">0</div>
          <div class="stat-label">Need Work</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="today-cost">$0.00</div>
          <div class="stat-label">Today's Cost</div>
        </div>
      </section>

      <!-- Priority Fixes -->
      <section class="priority-section">
        <h2>Priority Fixes</h2>
        <div class="priority-list" id="priority-list">
          <div class="empty-state">No issues found</div>
        </div>
      </section>

      <!-- Settings Section -->
      <section class="settings-section">
        <h2>Settings</h2>
        <form id="settings-form">
          <div class="form-group">
            <label for="base-url">API Base URL</label>
            <input type="url" id="base-url" placeholder="https://api.anthropic.com">
          </div>
          <div class="form-group">
            <label for="model">Model</label>
            <select id="model">
              <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
              <option value="claude-opus-4-20250514">Claude Opus 4</option>
              <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
              <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
              <option value="claude-3-opus-20240229">Claude 3 Opus</option>
            </select>
          </div>
          <div class="form-group">
            <label for="api-key">API Key (leave empty to keep current)</label>
            <input type="password" id="api-key" placeholder="sk-ant-...">
          </div>
          <div class="form-group">
            <label for="target-score-input">Target Score</label>
            <input type="number" id="target-score-input" min="0" max="100" value="95">
          </div>
          <div class="form-group">
            <h3>Agent Weights</h3>
            <div class="weight-sliders">
              <div class="weight-slider">
                <label>Architect: <span id="architect-weight-val">1.0</span></label>
                <input type="range" id="architect-weight" min="0" max="2" step="0.1" value="1.0">
              </div>
              <div class="weight-slider">
                <label>Critic: <span id="critic-weight-val">1.2</span></label>
                <input type="range" id="critic-weight" min="0" max="2" step="0.1" value="1.2">
              </div>
              <div class="weight-slider">
                <label>Pragmatist: <span id="pragmatist-weight-val">0.8</span></label>
                <input type="range" id="pragmatist-weight" min="0" max="2" step="0.1" value="0.8">
              </div>
            </div>
          </div>
          <button type="submit" class="btn-primary">Save Settings</button>
        </form>
      </section>

      <!-- File Verdicts -->
      <section class="verdicts-section">
        <h2>File Verdicts</h2>
        <div class="verdicts-list" id="verdicts-list">
          <div class="empty-state">No files analyzed yet</div>
        </div>
      </section>
    </main>

    <footer>
      <p>Code Parliament v1.0.0 | <a href="#" id="refresh-btn">Refresh</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
