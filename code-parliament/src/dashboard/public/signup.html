<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Code Parliament</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-primary);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .auth-header .logo {
      font-size: 24px;
      display: block;
      margin-bottom: 16px;
    }
    .auth-header p {
      color: var(--text-secondary);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }
    .form-group input::placeholder {
      color: var(--text-muted);
    }
    .auth-card .btn {
      width: 100%;
      margin-top: 8px;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .auth-divider span {
      padding: 0 16px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .auth-footer a {
      color: var(--accent-primary);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .oauth-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-hover);
    }
    .oauth-btn svg {
      width: 20px;
      height: 20px;
    }
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--error);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .plan-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .plan-option {
      padding: 16px 12px;
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .plan-option:hover {
      border-color: var(--border-hover);
    }
    .plan-option.selected {
      border-color: var(--accent-primary);
      background: rgba(139, 92, 246, 0.1);
    }
    .plan-option .plan-name {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .plan-option .plan-price {
      font-size: 12px;
      color: var(--text-muted);
    }
    .back-link {
      position: fixed;
      top: 24px;
      left: 24px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-link:hover {
      color: var(--text-primary);
    }
    .terms {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 16px;
    }
    .terms a {
      color: var(--accent-primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a href="/" class="back-link">← Back to Home</a>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <span class="logo">Code Parliament</span>
        <p>Create your account to get started</p>
      </div>

      <div class="error-message" id="error-message"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
        </div>

        <label style="font-size: 14px; font-weight: 500; margin-bottom: 12px; display: block;">Choose your plan</label>
        <div class="plan-selector">
          <div class="plan-option selected" data-plan="free">
            <div class="plan-name">Free</div>
            <div class="plan-price">$0/mo</div>
          </div>
          <div class="plan-option" data-plan="pro">
            <div class="plan-name">Pro</div>
            <div class="plan-price">$19/mo</div>
          </div>
          <div class="plan-option" data-plan="team">
            <div class="plan-name">Team</div>
            <div class="plan-price">$49/mo</div>
          </div>
        </div>
        <input type="hidden" id="plan" name="plan" value="free">

        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
      </form>

      <p class="terms">
        By signing up, you agree to our <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>
      </p>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="oauth-buttons">
        <button class="oauth-btn" onclick="oauthGitHub()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </button>
        <button class="oauth-btn" onclick="oauthGoogle()">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // Plan selection
    document.querySelectorAll('.plan-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.plan-option').forEach(o => o.classList.remove('selected'));
        option.classList.add('selected');
        document.getElementById('plan').value = option.dataset.plan;
      });
    });

    // Check URL params for pre-selected plan
    const urlParams = new URLSearchParams(window.location.search);
    const planParam = urlParams.get('plan');
    if (planParam) {
      document.querySelectorAll('.plan-option').forEach(o => o.classList.remove('selected'));
      const selected = document.querySelector(`[data-plan="${planParam}"]`);
      if (selected) {
        selected.classList.add('selected');
        document.getElementById('plan').value = planParam;
      }
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const plan = document.getElementById('plan').value;
      const errorEl = document.getElementById('error-message');

      try {
        const res = await fetch(`${API_BASE}/api/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, plan }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Signup failed');
        }

        localStorage.setItem('parliament_token', data.token);

        // Redirect to Stripe checkout for paid plans
        if (plan !== 'free' && data.checkoutUrl) {
          window.location.href = data.checkoutUrl;
        } else {
          window.location.href = '/dashboard';
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });

    function oauthGitHub() {
      const plan = document.getElementById('plan').value;
      window.location.href = `${API_BASE}/api/auth/github?plan=${plan}`;
    }

    function oauthGoogle() {
      const plan = document.getElementById('plan').value;
      window.location.href = `${API_BASE}/api/auth/google?plan=${plan}`;
    }
  </script>
</body>
</html>
